name: Release

on:
  push:
    tags:
      - "v*.*.*-beta.*"   # beta pre-release
      - "v*.*.*"           # stable release

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Determine pre-release
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-beta."* || "$TAG" == *"-alpha."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build .app bundle
        run: |
          # T16: full macOS .app bundle with icon, Info.plist, resources.
          # Codesigning + notarization + DMG require Apple Developer creds —
          # run scripts/notarize.sh locally and upload the DMG manually.
          VERSION="${{ steps.meta.outputs.tag }}"
          VERSION="${VERSION#v}"
          ./scripts/build-app.sh "$VERSION" "${{ github.run_number }}"

      - name: Package artifacts
        run: |
          mkdir -p dist
          # ZIP the .app bundle (preserves bundle structure)
          ditto -c -k --keepParent build/AerialWall.app \
            dist/AerialWall-${{ steps.meta.outputs.tag }}-macos-arm64.zip
          # Also ship raw executables for power users
          cp .build/release/AerialWall       dist/AerialWall
          cp .build/release/AerialWallAgent  dist/AerialWallAgent
          chmod +x dist/AerialWall dist/AerialWallAgent
          tar -czf dist/AerialWall-${{ steps.meta.outputs.tag }}-cli-macos-arm64.tar.gz \
            -C dist AerialWall AerialWallAgent

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
