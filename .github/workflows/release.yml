name: Release

on:
  push:
    tags:
      - "v*.*.*-beta.*"   # beta pre-release
      - "v*.*.*"           # stable release

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Determine pre-release
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$TAG" == *"-beta."* || "$TAG" == *"-alpha."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build .app bundle
        run: ./scripts/build-app.sh "${{ steps.meta.outputs.version }}" "${{ github.run_number }}"

      - name: Package artifacts
        id: pkg
        run: |
          mkdir -p dist
          ZIP="dist/AerialWall-${{ steps.meta.outputs.tag }}-macos-arm64.zip"
          ditto -c -k --keepParent build/AerialWall.app "$ZIP"
          cp .build/release/AerialWall      dist/AerialWall
          cp .build/release/AerialWallAgent dist/AerialWallAgent
          chmod +x dist/AerialWall dist/AerialWallAgent
          tar -czf dist/AerialWall-${{ steps.meta.outputs.tag }}-cli-macos-arm64.tar.gz \
            -C dist AerialWall AerialWallAgent
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.tar.gz

      # ── Homebrew cask publish ───────────────────────────────────────────
      # Updates the cask in the main repo (Casks/aerialwall.rb) so the
      # `brew tap CatKinKitKat/aerialwall` users get the new version on
      # their next `brew update`. Requires the tap repo to be set up:
      #   gh repo create CatKinKitKat/homebrew-aerialwall --public
      # and the GitHub Actions bot to have write access to it via the
      # HOMEBREW_TAP_TOKEN secret (a PAT with `repo` scope).
      # ───────────────────────────────────────────────────────────────────
      - name: Update Homebrew cask
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/CatKinKitKat/homebrew-aerialwall.git" tap
          mkdir -p tap/Casks
          # Render the cask file with the new version + sha256
          sed -e 's|version "[^"]*"|version "${{ steps.meta.outputs.version }}"|' \
              -e 's|sha256 "[^"]*"|sha256 "${{ steps.pkg.outputs.sha256 }}"|' \
              Casks/aerialwall.rb > tap/Casks/aerialwall.rb
          cd tap
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add Casks/aerialwall.rb
          git diff --cached --quiet || \
            git commit -m "aerialwall ${{ steps.meta.outputs.version }}"
          git push
