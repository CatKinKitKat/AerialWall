name: Release

on:
  push:
    tags:
      - "v*.*.*-beta.*"   # beta pre-release
      - "v*.*.*"           # stable release

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release

      # ── Packaging note ─────────────────────────────────────────────────────
      # Full .app bundle + notarization + DMG packaging is tracked in SPEC §T16.
      # Until T16 is complete, releases ship the macOS executable + source only.
      # ────────────────────────────────────────────────────────────────────────

      - name: Determine pre-release
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-beta."* || "$TAG" == *"-alpha."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package executables
        run: |
          mkdir -p dist
          cp .build/release/AerialWall       dist/AerialWall
          cp .build/release/AerialWallAgent  dist/AerialWallAgent
          chmod +x dist/AerialWall dist/AerialWallAgent
          tar -czf dist/AerialWall-${{ steps.meta.outputs.tag }}-macos-arm64.tar.gz \
            -C dist AerialWall AerialWallAgent

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*.tar.gz
