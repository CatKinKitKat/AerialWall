name: Feature Request
description: Suggest something new or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do that AerialWall doesn't support?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Mockups welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Import / transcoding
        - Wallpaper injection
        - UI / UX
        - Persistence / daemon
        - Performance
        - Packaging / distribution
        - Other

  - type: textarea
    id: extra
    attributes:
      label: Additional context
